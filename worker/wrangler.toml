name = "kanji-my-name-codes"
main = "worker.js"
compatibility_date = "2026-08-01"

# After `wrangler login`, create the namespace and paste its id here:
#   npx wrangler kv namespace create CODES
[[kv_namespaces]]
binding = "CODES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (set once):
#   npx wrangler secret put STRIPE_SECRET_KEY
